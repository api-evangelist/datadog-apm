- aid: datadog-apm:datadog-apm-mcp-server
  name: Datadog MCP Server
  description: >-
    Datadog's first-party remote Model Context Protocol server. OAuth 2.1 with PKCE and dynamic
    client registration; a dedicated apm toolset covering span search, trace queries, Watchdog
    anomaly stories, latency-bottleneck analysis and APM recommendations. An anonymous tools/list
    returns HTTP 401, so the live schemas are auth-gated.
  humanURL: https://docs.datadoghq.com/bits_ai/mcp_server/
  baseURL: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
  tags:
