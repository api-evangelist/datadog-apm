- aid: datadog-apm:datadog-apm-spans-metrics-api
  name: Datadog APM Spans Metrics API
  description: >-
    Create, read, update and delete span-based metric definitions — a compute over a span attribute,
    a filter query and group-by tags. Five operations.
  humanURL: https://docs.datadoghq.com/api/latest/spans-metrics/
