- aid: datadog-apm:datadog-apm-retention-filters-api
  name: Datadog APM Retention Filters API
  description: >-
    Manage the ordered list of retention filters that decide which spans Datadog indexes and for how
    long. Six operations including a whole-list reorder. The highest-consequence write surface in
    Datadog APM — a deleted filter loses observability data that cannot be recovered.
  humanURL: https://docs.datadoghq.com/api/latest/apm-retention-filters/
  baseURL: https://api.datadoghq.com
  tags:
  - APM Retention Filters
  properties:
