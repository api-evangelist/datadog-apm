- aid: datadog-apm:datadog-apm-slo-corrections-api
  name: Datadog APM SLO Corrections API
  description: >-
    Manage time-boxed corrections that exclude a window from an SLO error budget, optionally
    recurring by rrule. Five operations, and the only genuinely reversible write in the APM surface.
