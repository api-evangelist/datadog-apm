note: >-
  Datadog publishes no dated changelog for the HTTP API itself. The authoritative dated record of API
  change is the CHANGELOG.md of the generated clients, because the clients are regenerated from the
  same OpenAPI documents this repo's openapi/ artifacts were extracted from — an entry there IS a
  spec change. Entries are grouped Added / Changed / Fixed / Removed / Deprecated, so breaking change
  is signalled structurally. The in-product release notes at https://app.datadoghq.com/release-notes
  cover the product rather than the contract and rendered as an application shell to an anonymous fetch.
