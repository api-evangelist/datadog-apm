domain_standards:
- id: opentelemetry
  name: OpenTelemetry
  conforms: true
  market: application performance monitoring / observability
  evidence: >-
    https://docs.datadoghq.com/opentelemetry/ (HTTP 200) — Datadog ingests OTLP natively and ships an
    OpenTelemetry Collector distribution; the tracer libraries in packages/ accept OTel instrumentation.
  significance: >-
    This is the domain standard that decides integration cost in APM. A team already emitting OTLP
    can send telemetry to Datadog without a bespoke exporter; a vendor that only accepts its own wire
    format requires re-instrumentation.
- id: w3c-trace-context
  name: W3C Trace Context (traceparent / tracestate)
  conforms: true
  market: distributed tracing
  evidence: >-
    https://docs.datadoghq.com/tracing/trace_collection/trace_context_propagation/ (HTTP 200), and the
    published wire protocol itself: grpc/datadog-apm-span.proto declares `string tracestate` and W3C
    trace flags on SpanLink, copied verbatim from Datadog's own proto.
  significance: >-
    Header-level interoperability — a trace started in a non-Datadog service is continued rather than
    broken, which is the difference between one trace and two.
- id: statsd
  name: StatsD / DogStatsD
  conforms: true
  market: metrics submission
  evidence: >-
    DogStatsD is a documented superset of the StatsD line protocol, shipped in the first-party client
    libraries listed in packages/.
