versioning:
  scheme: URI path
  current:
  - v1
  - v2
  detail: >-
    Datadog runs /api/v1/ and /api/v2/ side by side. v2 is not a successor to v1 in this product —
    the APM surface is split across both, permanently: SLOs and SLO corrections are v1-only, spans,
    span metrics, retention filters and service definitions are v2-only. There is no deprecation of
    v1 implied by the existence of v2.
  spec_versions:
    v1: '1.0'
    v2: '1.0'
    note: >-
      The published OpenAPI carries info.version 1.0 for both documents; the moving version number
      that actually tracks change is the generated client release (see packages/).
