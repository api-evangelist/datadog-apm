openapi: 3.0.0
info:
  title: Datadog APM — Service Level Objectives (API v1)
  description: The Service Level Objective surface of the Datadog API v1, extracted verbatim from the
    OpenAPI definition Datadog publishes for its own API clients.
  version: '1.0'
  contact:
    email: support@datadoghq.com
    name: Datadog Support
    url: https://www.datadoghq.com/support/
  x-source: https://raw.githubusercontent.com/DataDog/datadog-api-client-go/master/.generator/schemas/v1/openapi.yaml
  x-extracted: '2026-09-05'
  x-extraction-note: Path items, components and security schemes copied VERBATIM from the Datadog-published
    OpenAPI at x-source; only the APM-relevant subset of paths is retained. No content was authored by
    API Evangelist.
servers:
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: The regional site for Datadog customers.
      enum:
      - datadoghq.com
      - us3.datadoghq.com
      - us5.datadoghq.com
      - ap1.datadoghq.com
      - ap2.datadoghq.com
      - uk1.datadoghq.com
      - datadoghq.eu
      - ddog-gov.com
      - us2.ddog-gov.com
      - uk1.datadoghq.com
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
- url: '{protocol}://{name}'
  variables:
    name:
      default: api.datadoghq.com
      description: Full site DNS name.
    protocol:
      default: https
      description: The protocol for accessing the API.
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: Any Datadog deployment.
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
security:
- apiKeyAuth: []
  appKeyAuth: []
tags:
- description: 'SLO Status Corrections allow you to prevent specific time periods from negatively impacting

    your SLO’s status and error budget. You can use Status Corrections for various purposes, such

    as removing planned maintenance windows, non-business hours, or other time periods that do

    not correspond to genuine issues. See [SLO status corrections](https://docs.datadoghq.com/service_management/service_level_objectives/#slo-status-corrections)
    for more information.'
  name: Service Level Objective Corrections
- description: '[Service Level Objectives](https://docs.datadoghq.com/monitors/service_level_objectives/#configuration)

    (or SLOs) are a key part of the site reliability engineering toolkit.

    SLOs provide a framework for defining clear targets around application performance,

    which ultimately help teams provide a consistent customer experience,

    balance feature development with platform stability,

    and improve communication with internal and external users.'
  name: Service Level Objectives
paths:
  /api/v1/slo:
    get:
      description: Get a list of service level objective objects for your organization.
      operationId: ListSLOs
      parameters:
      - description: A comma separated list of the IDs of the service level objectives objects.
        example: id1, id2, id3
        in: query
        name: ids
        required: false
        schema:
          type: string
      - description: The query string to filter results based on SLO names.
        example: monitor
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: The query string to filter results based on a single SLO tag.
        example: env:prod
        in: query
        name: tags_query
        required: false
        schema:
          type: string
      - description: The query string to filter results based on SLO numerator and denominator.
        example: aws.elb.request_count
        in: query
        name: metrics_query
        required: false
        schema:
          type: string
      - description: The number of SLOs to return in the response.
        in: query
        name: limit
        required: false
        schema:
          default: 1000
          format: int64
          type: integer
      - description: The specific offset to use as the beginning of the returned response.
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
      - description: Whether to return only deleted service level objective objects.
        example: true
        in: query
        name: is_deleted
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - id: abc-123
                      name: Custom Metric SLO
                      tags:
                      - env:prod
                      - app:core
                      thresholds:
                      - target: 95
                        timeframe: 7d
                      - target: 95
                        timeframe: 30d
                        warning: 97
                      type: metric
                    errors: []
              schema:
                $ref: '#/components/schemas/SLOListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Get all SLOs
      tags:
      - Service Level Objectives
      x-pagination:
        limitParam: limit
        pageOffsetParam: offset
        resultsPath: data
      x-permission:
        operator: OR
        permissions:
        - slos_read
    post:
      description: Create a service level objective object.
      operationId: CreateSLO
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  description: Track the availability of our custom metric.
                  name: Custom Metric SLO
                  query:
                    denominator: sum:my.custom.metric{*}.as_count()
                    numerator: sum:my.custom.metric{type:good}.as_count()
                  tags:
                  - env:prod
                  - app:core
                  thresholds:
                  - target: 95
                    timeframe: 7d
                  - target: 95
                    timeframe: 30d
                    warning: 97
                  type: metric
            schema:
              $ref: '#/components/schemas/ServiceLevelObjectiveRequest'
        description: Service level objective request object.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - description: Track the availability of our custom metric.
                      id: abc-123
                      name: Custom Metric SLO
                      tags:
                      - env:prod
                      - app:core
                      thresholds:
                      - target: 95
                        target_display: '95.0'
                        timeframe: 7d
                      type: metric
                    errors: []
              schema:
                $ref: '#/components/schemas/SLOListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_write
      summary: Create an SLO object
      tags:
      - Service Level Objectives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - slos_write
  /api/v1/slo/bulk_delete:
    post:
      description: 'Delete (or partially delete) multiple service level objective objects.


        This endpoint facilitates deletion of one or more thresholds for one or more

        service level objective objects. If all thresholds are deleted, the service level

        objective object is deleted as well.'
      operationId: DeleteSLOTimeframeInBulk
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  id1:
                  - 7d
                  - 30d
                  id2:
                  - 7d
                  - 30d
            schema:
              $ref: '#/components/schemas/SLOBulkDelete'
        description: Delete multiple service level objective objects request body.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      deleted: []
                      updated:
                      - abc-123
                    errors: []
              schema:
                $ref: '#/components/schemas/SLOBulkDeleteResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_write
      summary: Bulk Delete SLO Timeframes
      tags:
      - Service Level Objectives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - slos_write
  /api/v1/slo/can_delete:
    get:
      description: 'Check if an SLO can be safely deleted. For example,

        assure an SLO can be deleted without disrupting a dashboard.'
      operationId: CheckCanDeleteSLO
      parameters:
      - description: A comma separated list of the IDs of the service level objectives objects.
        example: id1, id2, id3
        in: query
        name: ids
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      ok:
                      - abc-123
                    errors: {}
              schema:
                $ref: '#/components/schemas/CheckCanDeleteSLOResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckCanDeleteSLOResponse'
          description: Conflict
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Check if SLOs can be safely deleted
      tags:
      - Service Level Objectives
      x-permission:
        operator: OR
        permissions:
        - slos_read
  /api/v1/slo/search:
    get:
      description: Get a list of service level objective objects for your organization.
      operationId: SearchSLO
      parameters:
      - description: 'The query string to filter results based on SLO names.

          Some examples of queries include `service:<service-name>`

          and `<slo-name>`.'
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: The number of files to return in the response `[default=10]`.
        in: query
        name: page[size]
        required: false
        schema:
          format: int64
          type: integer
      - description: The identifier of the first page to return. This parameter is used for the pagination
          feature `[default=0]`.
        in: query
        name: page[number]
        required: false
        schema:
          format: int64
          type: integer
      - description: Whether or not to return facet information in the response `[default=false]`.
        in: query
        name: include_facets
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        slos:
                        - data:
                            attributes:
                              name: Example SLO
                              thresholds:
                              - target: 95
                                target_display: '95'
                                timeframe: 7d
                            id: abc-123
                            type: slo
                      type: service_level_objective_search_results
              schema:
                $ref: '#/components/schemas/SearchSLOResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Search for SLOs
      tags:
      - Service Level Objectives
      x-permission:
        operator: OR
        permissions:
        - slos_read
  /api/v1/slo/{slo_id}:
    delete:
      description: 'Permanently delete the specified service level objective object.


        If an SLO is used in a dashboard, the `DELETE /v1/slo/` endpoint returns

        a 409 conflict error because the SLO is referenced in a dashboard.'
      operationId: DeleteSLO
      parameters:
      - description: The ID of the service level objective.
        in: path
        name: slo_id
        required: true
        schema:
          type: string
      - description: Delete the monitor even if it's referenced by other resources (for example SLO, composite
          monitor).
        in: query
        name: force
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - abc-123
                    errors: {}
              schema:
                $ref: '#/components/schemas/SLODeleteResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLODeleteResponse'
          description: Conflict
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_write
      summary: Delete an SLO
      tags:
      - Service Level Objectives
      x-permission:
        operator: OR
        permissions:
        - slos_write
    get:
      description: Get a service level objective object.
      operationId: GetSLO
      parameters:
      - description: The ID of the service level objective object.
        in: path
        name: slo_id
        required: true
        schema:
          type: string
      - description: Get the IDs of SLO monitors that reference this SLO.
        example: true
        in: query
        name: with_configured_alert_ids
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      description: Track the availability of our custom metric.
                      id: abc-123
                      name: Custom Metric SLO
                      tags:
                      - env:prod
                      thresholds:
                      - target: 95
                        target_display: '95.0'
                        timeframe: 7d
                      type: metric
                    errors: []
              schema:
                $ref: '#/components/schemas/SLOResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Get an SLO's details
      tags:
      - Service Level Objectives
      x-permission:
        operator: OR
        permissions:
        - slos_read
    put:
      description: Update the specified service level objective object.
      operationId: UpdateSLO
      parameters:
      - description: The ID of the service level objective object.
        in: path
        name: slo_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  description: Updated description for the SLO.
                  name: Custom Metric SLO
                  query:
                    denominator: sum:my.custom.metric{*}.as_count()
                    numerator: sum:my.custom.metric{type:good}.as_count()
                  tags:
                  - env:prod
                  - app:core
                  thresholds:
                  - target: 95
                    timeframe: 7d
                  - target: 95
                    timeframe: 30d
                    warning: 97
                  type: metric
            schema:
              $ref: '#/components/schemas/ServiceLevelObjective'
        description: The edited service level objective request object.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - description: Updated description for the SLO.
                      id: abc-123
                      name: Custom Metric SLO
                      tags:
                      - env:prod
                      thresholds:
                      - target: 95
                        target_display: '95.0'
                        timeframe: 7d
                      type: metric
                    errors: []
              schema:
                $ref: '#/components/schemas/SLOListResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_write
      summary: Update an SLO
      tags:
      - Service Level Objectives
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - slos_write
  /api/v1/slo/{slo_id}/history:
    get:
      description: 'Get a specific SLO’s history, regardless of its SLO type.


        The detailed history data is structured according to the source data type.

        For example, metric data is included for event SLOs that use

        the metric source, and monitor SLO types include the monitor transition history.


        **Note:** There are different response formats for event based and time based SLOs.

        Examples of both are shown.'
      operationId: GetSLOHistory
      parameters:
      - description: The ID of the service level objective object.
        in: path
        name: slo_id
        required: true
        schema:
          type: string
      - description: The `from` timestamp for the query window in epoch seconds.
        in: query
        name: from_ts
        required: true
        schema:
          format: int64
          type: integer
      - description: The `to` timestamp for the query window in epoch seconds.
        in: query
        name: to_ts
        required: true
        schema:
          format: int64
          type: integer
      - description: The SLO target. If `target` is passed in, the response will include the remaining
          error budget and a timeframe value of `custom`.
        in: query
        name: target
        schema:
          exclusiveMaximum: true
          exclusiveMinimum: true
          format: double
          maximum: 100
          minimum: 0
          type: number
      - description: 'Defaults to `true`. If any SLO corrections are applied and this parameter is set
          to `false`,

          then the corrections will not be applied and the SLI values will not be affected.'
        in: query
        name: apply_correction
        required: false
        schema:
          type: boolean
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      from_ts: 1615323990
                      overall:
                        sli_value: 99.99
                        span_precision: 2.0
                      thresholds:
                        7d:
                          target: 95
                          timeframe: 7d
                      to_ts: 1615928790
                      type: metric
                      type_id: 1
                    errors: null
              schema:
                $ref: '#/components/schemas/SLOHistoryResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Get an SLO's history
      tags:
      - Service Level Objectives
      x-permission:
        operator: OR
        permissions:
        - slos_read
  /api/v1/slo/correction:
    get:
      description: Get all Service Level Objective corrections.
      operationId: ListSLOCorrection
      parameters:
      - description: The specific offset to use as the beginning of the returned response.
        in: query
        name: offset
        required: false
        schema:
          format: int64
          type: integer
      - description: The number of SLO corrections to return in the response. Default is 25.
        in: query
        name: limit
        required: false
        schema:
          default: 25
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - attributes:
                        category: Scheduled Maintenance
                        end: 1600003600
                        slo_id: abc-123
                        start: 1600000000
                        timezone: UTC
                      id: abc-123
                      type: correction
              schema:
                $ref: '#/components/schemas/SLOCorrectionListResponse'
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_read
      summary: Get all SLO corrections
      tags:
      - Service Level Objective Corrections
      x-pagination:
        limitParam: limit
        pageOffsetParam: offset
        resultsPath: data
      x-permission:
        operator: OR
        permissions:
        - slos_read
    post:
      description: 'Create an SLO correction. Use `slo_id` to apply the correction to a single SLO, or
        `slo_query` to apply the

        correction to SLOs that match a query. Exactly one of `slo_id` or `slo_query` is required.'
      operationId: CreateSLOCorrection
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      category: Scheduled Maintenance
                      description: Planned maintenance window for database upgrade.
                      end: 1600003600
                      slo_id: sloId
                      start: 1600000000
                      timezone: UTC
                    type: correction
              slo_query:
                value:
                  data:
                    attributes:
                      category: Scheduled Maintenance
                      description: Planned maintenance window for checkout services.
                      end: 1600003600
                      slo_query: env:prod service:checkout
                      start: 1600000000
                      timezone: UTC
                    type: correction
            schema:
              $ref: '#/components/schemas/SLOCorrectionCreateRequest'
        description: Create an SLO Correction
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        category: Scheduled Maintenance
                        end: 1600003600
                        slo_id: abc-123
                        start: 1600000000
                        timezone: UTC
                      id: abc-123
                      type: correction
              schema:
                $ref: '#/components/schemas/SLOCorrectionResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: SLO Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - slos_corrections
      summary: Create an SLO correction
      tags:
      - Service Level Objective Corrections
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - slos_corrections
  /api/v1/slo/correction/{slo_correction_id}:
    delete:
      description: Permanently delete the specified SLO correction object.
      operationId: DeleteSLOCorrection
      parameters:
      - description: The ID of the SLO correction object.
        in: path
        name: slo_correction_id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: OK
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
