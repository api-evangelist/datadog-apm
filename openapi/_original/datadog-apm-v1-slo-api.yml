components:
  schemas:
    SLOHistoryResponse:
      description: A service level objective history response.
      properties:
        data:
          $ref: '#/components/schemas/SLOHistoryResponseData'
        errors:
          description: A list of errors while querying the history data for the service level objective.
          items:
            $ref: '#/components/schemas/SLOHistoryResponseError'
          nullable: true
          type: array
      type: object
    ServiceLevelObjectiveRequest:
      description: 'A service level objective object includes a service level indicator, thresholds

        for one or more timeframes, and metadata (`name`, `description`, `tags`, etc.).'
      properties:
        description:
          description: 'A user-defined description of the service level objective.


            Always included in service level objective responses (but may be `null`).

            Optional in create/update requests.'
          nullable: true
          type: string
        groups:
          description: 'A list of (up to 100) monitor groups that narrow the scope of a monitor service
            level objective.


            Included in service level objective responses if it is not empty. Optional in

            create/update requests for monitor service level objectives, but may only be

            used when then length of the `monitor_ids` field is one.'
          example:
          - env:prod
          - role:mysql
          items:
            description: A group name, for instance `env:prod`.
            type: string
          type: array
        monitor_ids:
          description: 'A list of monitor IDs that defines the scope of a monitor service level

            objective. **Required if type is `monitor`**.'
          items:
            description: A monitor ID.
            format: int64
            type: integer
          type: array
        name:
          description: The name of the service level objective object.
          example: Custom Metric SLO
          type: string
        query:
          $ref: '#/components/schemas/ServiceLevelObjectiveQuery'
        sli_specification:
          $ref: '#/components/schemas/SLOSliSpec'
        tags:
          description: 'A list of tags associated with this service level objective.

            Always included in service level objective responses (but may be empty).

            Optional in create/update requests.'
          example:
          - env:prod
          - app:core
          items:
            description: A tag to apply to your SLO.
            type: string
          type: array
        target_threshold:
          description: 'The target threshold such that when the service level indicator is above this

            threshold over the given timeframe, the objective is being met.'
          example: 99.9
          format: double
          type: number
        thresholds:
          description: 'The thresholds (timeframes and associated targets) for this service level

            objective object.'
          example:
          - target: 95
            timeframe: 7d
          - target: 95
            timeframe: 30d
            warning: 97
          items:
            $ref: '#/components/schemas/SLOThreshold'
          type: array
        timeframe:
          $ref: '#/components/schemas/SLOTimeframe'
        type:
          $ref: '#/components/schemas/SLOType'
        warning_threshold:
          description: 'The optional warning threshold such that when the service level indicator is

            below this value for the given threshold, but above the target threshold, the

            objective appears in a "warning" state. This value must be greater than the target

            threshold.'
          example: 99.95
          format: double
          type: number
      required:
      - name
      - thresholds
      - type
      type: object
    SLOSliSpec:
      description: A generic SLI specification. This is used for time-slice and count-based (metric) SLOs
        only.
      oneOf:
      - $ref: '#/components/schemas/SLOTimeSliceSpec'
      - $ref: '#/components/schemas/SLOCountSpec'
    SLOCorrectionResponse:
      description: The response object of an SLO correction.
      properties:
        data:
          $ref: '#/components/schemas/SLOCorrection'
      type: object
    SLOTimeSliceSpec:
      additionalProperties: false
      description: A time-slice SLI specification.
      example:
        time_slice:
          comparator: <
          query:
            formulas:
            - formula: query2/query1
            queries:
            - data_source: metrics
              name: query1
              query: sum:trace.servlet.request.hits{*} by {env}.as_count()
            - data_source: metrics
              name: query2
              query: sum:trace.servlet.request.errors{*} by {env}.as_count()
          threshold: 5
      properties:
        time_slice:
          $ref: '#/components/schemas/SLOTimeSliceCondition'
      required:
      - time_slice
      type: object
    ServiceLevelObjective:
      description: 'A service level objective object includes a service level indicator, thresholds

        for one or more timeframes, and metadata (`name`, `description`, `tags`, etc.).'
      properties:
        created_at:
          description: 'Creation timestamp (UNIX time in seconds)


            Always included in service level objective responses.'
          format: int64
          readOnly: true
          type: integer
        creator:
          $ref: '#/components/schemas/Creator'
        description:
          description: 'A user-defined description of the service level objective.


            Always included in service level objective responses (but may be `null`).

            Optional in create/update requests.'
          nullable: true
          type: string
        groups:
          description: 'A list of (up to 100) monitor groups that narrow the scope of a monitor service
            level objective.


            Included in service level objective responses if it is not empty. Optional in

            create/update requests for monitor service level objectives, but may only be

            used when then length of the `monitor_ids` field is one.'
          example:
          - env:prod
          - role:mysql
          items:
            description: A group name, for instance `env:prod`.
            type: string
          type: array
        id:
          description: 'A unique identifier for the service level objective object.


            Always included in service level objective responses.'
          readOnly: true
          type: string
        modified_at:
          description: 'Modification timestamp (UNIX time in seconds)


            Always included in service level objective responses.'
          format: int64
          readOnly: true
          type: integer
        monitor_ids:
          description: 'A list of monitor ids that defines the scope of a monitor service level

            objective. **Required if type is `monitor`**.'
          items:
            description: A monitor ID.
            format: int64
            type: integer
          type: array
        monitor_tags:
          description: 'The union of monitor tags for all monitors referenced by the `monitor_ids`

            field.

            Always included in service level objective responses for monitor-based service level

            objectives (but may be empty). Ignored in create/update requests. Does not

            affect which monitors are included in the service level objective (that is

            determined entirely by the `monitor_ids` field).'
          items:
            description: A monitor tag.
            type: string
          type: array
        name:
          description: The name of the service level objective object.
          example: Custom Metric SLO
          type: string
        query:
          $ref: '#/components/schemas/ServiceLevelObjectiveQuery'
        sli_specification:
          $ref: '#/components/schemas/SLOSliSpec'
        tags:
          description: 'A list of tags associated with this service level objective.

            Always included in service level objective responses (but may be empty).

            Optional in create/update requests.'
          example:
          - env:prod
          - app:core
          items:
            description: A tag to apply to your SLO.
            type: string
          type: array
        target_threshold:
          description: 'The target threshold such that when the service level indicator is above this

            threshold over the given timeframe, the objective is being met.'
          example: 99.9
          format: double
          type: number
        thresholds:
          description: 'The thresholds (timeframes and associated targets) for this service level

            objective object.'
          example:
          - target: 95
            timeframe: 7d
          - target: 95
            timeframe: 30d
            warning: 97
          items:
            $ref: '#/components/schemas/SLOThreshold'
          type: array
        timeframe:
          $ref: '#/components/schemas/SLOTimeframe'
        type:
          $ref: '#/components/schemas/SLOType'
        warning_threshold:
          description: 'The optional warning threshold such that when the service level indicator is

            below this value for the given threshold, but above the target threshold, the

            objective appears in a "warning" state. This value must be greater than the target

            threshold.'
          example: 99.95
          format: double
          type: number
      required:
      - name
      - thresholds
      - type
      type: object
    SearchSLOResponse:
      description: A search SLO response containing results from the search query.
      properties:
        data:
          $ref: '#/components/schemas/SearchSLOResponseData'
        links:
          $ref: '#/components/schemas/SearchSLOResponseLinks'
        meta:
          $ref: '#/components/schemas/SearchSLOResponseMeta'
      type: object
    SLOCorrectionCreateRequest:
      description: An object that defines a correction to be applied to one or more SLOs.
      properties:
        data:
          $ref: '#/components/schemas/SLOCorrectionCreateData'
      type: object
    SLOThreshold:
      description: SLO thresholds (target and optionally warning) for a single time window.
      properties:
        target:
          description: 'The target value for the service level indicator within the corresponding

            timeframe.'
          example: 99.9
          format: double
          type: number
        target_display:
          description: 'A string representation of the target that indicates its precision.

            It uses trailing zeros to show significant decimal places (for example `98.00`).


            Always included in service level objective responses. Ignored in

            create/update requests.'
          example: '99.9'
          type: string
        timeframe:
          $ref: '#/components/schemas/SLOTimeframe'
        warning:
          description: The warning value for the service level objective.
          example: 90.0
          format: double
          type: number
        warning_display:
          description: 'A string representation of the warning target (see the description of

            the `target_display` field for details).


            Included in service level objective responses if a warning target exists.

            Ignored in create/update requests.'
          example: '90.0'
          type: string
      required:
      - timeframe
      - target
      type: object
    SLOCountSpec:
      additionalProperties: false
      description: A metric SLI specification.
      example:
        count:
          bad_events_formula: query2
          good_events_formula: query1
          queries:
          - data_source: metrics
            name: query1
            query: sum:trace.servlet.request.hits{!http.status_code:500} by {env}.as_count()
          - data_source: metrics
            name: query2
            query: sum:trace.servlet.request.hits{http.status_code:500} by {env}.as_count()
      properties:
        count:
          $ref: '#/components/schemas/SLOCountDefinition'
      required:
      - count
      type: object
    SearchSLOResponseMeta:
      description: Searches metadata returned by the API.
      properties:
        pagination:
          $ref: '#/components/schemas/SearchSLOResponseMetaPage'
      type: object
    SLOTimeframe:
      description: 'The SLO time window options. Note that "custom" is not a valid option for creating

        or updating SLOs. It is only used when querying SLO history over custom timeframes.'
      enum:
      - 7d
      - 30d
      - 90d
      - custom
      example: 30d
      type: string
      x-enum-varnames:
      - SEVEN_DAYS
      - THIRTY_DAYS
      - NINETY_DAYS
      - CUSTOM
    SLOType:
      description: The type of the service level objective.
      enum:
      - metric
      - monitor
      - time_slice
      example: metric
      type: string
      x-enum-varnames:
      - METRIC
      - MONITOR
      - TIME_SLICE
    SLODeleteResponse:
      description: A response list of all service level objective deleted.
      properties:
        data:
          description: An array containing the ID of the deleted service level objective object.
          items:
            description: ID of a deleted SLO.
            type: string
          type: array
        errors:
          additionalProperties:
            description: Error preventing the SLO deletion.
            type: string
          description: An dictionary containing the ID of the SLO as key and a deletion error as value.
          type: object
      type: object
    CheckCanDeleteSLOResponse:
      description: A service level objective response containing the requested object.
      properties:
        data:
          $ref: '#/components/schemas/CheckCanDeleteSLOResponseData'
        errors:
          additionalProperties:
            description: Description of the service level objective reference.
            type: string
          description: A mapping of SLO id to it's current usages.
          type: object
      type: object
    SLOBulkDelete:
      additionalProperties:
        description: An array of all SLO timeframes.
        items:
          $ref: '#/components/schemas/SLOTimeframe'
        type: array
      description: 'A map of service level objective object IDs to arrays of timeframes,

        which indicate the thresholds to delete for each ID.'
      example:
        id1:
        - 7d
        - 30d
        id2:
        - 7d
        - 30d
      type: object
    SLOCorrectionListResponse:
      description: A list of  SLO correction objects.
      properties:
        data:
          description: The list of SLO corrections objects.
          items:
            $ref: '#/components/schemas/SLOCorrection'
          type: array
        meta:
          $ref: '#/components/schemas/ResponseMetaAttributes'
      type: object
    SearchSLOResponseData:
      description: Data from search SLO response.
      properties:
        attributes:
          $ref: '#/components/schemas/SearchSLOResponseDataAttributes'
        type:
          description: Type of service level objective result.
          example: ''
          type: string
      type: object
    CheckCanDeleteSLOResponseData:
      description: An array of service level objective objects.
      properties:
        ok:
          description: An array of SLO IDs that can be safely deleted.
          items:
            description: An SLO ID.
            type: string
          type: array
      type: object
    APIErrorResponse:
      description: Error response object.
      properties:
        errors:
          description: Array of errors returned by the API.
          example:
          - Bad Request
          items:
            description: Error description.
            example: Bad Request
            type: string
          type: array
      required:
      - errors
      type: object
    SLOBulkDeleteResponse:
      description: 'The bulk partial delete service level objective object endpoint

        response.


        This endpoint operates on multiple service level objective objects, so

        it may be partially successful. In such cases, the "data" and "error"

        fields in this response indicate which deletions succeeded and failed.'
      properties:
        data:
          $ref: '#/components/schemas/SLOBulkDeleteResponseData'
        errors:
          description: Array of errors object returned.
          items:
            $ref: '#/components/schemas/SLOBulkDeleteError'
          type: array
      type: object
    ServiceLevelObjectiveQuery:
      description: 'A count-based (metric) SLO query. This field is superseded by `sli_specification`
        but is retained for backwards compatibility. Note that Datadog only allows the sum by aggregator

        to be used because this will sum up all request counts instead of averaging them, or taking the
        max or

        min of all of those requests.'
      properties:
        denominator:
          description: A Datadog metric query for total (valid) events.
          example: sum:my.custom.metric{*}.as_count()
          type: string
        numerator:
          description: A Datadog metric query for good events.
          example: sum:my.custom.metric{type:good}.as_count()
          type: string
      required:
      - numerator
      - denominator
      type: object
    SLOTimeSliceCondition:
      description: 'The time-slice condition, composed of 3 parts: 1. the metric timeseries query, 2.
        the comparator,

        and 3. the threshold. Optionally, a fourth part, the query interval, can be provided.'
      example:
        comparator: <
        query:
          formulas:
          - formula: query2/query1
          queries:
          - data_source: metrics
            name: query1
            query: sum:trace.servlet.request.hits{*} by {env}.as_count()
          - data_source: metrics
            name: query1
            query: sum:trace.servlet.request.errors{*} by {env}.as_count()
        threshold: 5
      properties:
        comparator:
          $ref: '#/components/schemas/SLOTimeSliceComparator'
        query:
          $ref: '#/components/schemas/SLOTimeSliceQuery'
        query_interval_seconds:
          $ref: '#/components/schemas/SLOTimeSliceInterval'
        threshold:
          description: The threshold value to which each SLI value will be compared.
          example: 5
          format: double
          type: number
      required:
      - comparator
      - threshold
      - query
      type: object
    SLOCountDefinition:
      description: 'A count-based (metric) SLI specification, composed of three parts: the good events
        formula,

        the bad or total events formula, and the underlying queries.

        Exactly one of `total_events_formula` or `bad_events_formula` must be provided.'
      example:
        bad_events_formula: query2
        good_events_formula: query1
        queries:
        - data_source: metrics
          name: query1
          query: sum:trace.servlet.request.hits{!http.status_code:500} by {env}.as_count()
        - data_source: metrics
          name: query2
          query: sum:trace.servlet.request.hits{http.status_code:500} by {env}.as_count()
      oneOf:
      - $ref: '#/components/schemas/SLOCountDefinitionWithTotalEventsFormula'
      - $ref: '#/components/schemas/SLOCountDefinitionWithBadEventsFormula'
    SLOCountDefinitionWithBadEventsFormula:
      additionalProperties: false
      description: SLO count definition using a bad events formula alongside a good events formula.
      properties:
        bad_events_formula:
          $ref: '#/components/schemas/SLOFormula'
          description: The bad events formula (recommended). Total events queries can be defined using
            the `total_events_formula` field as an alternative. Only one of `total_events_formula` or
            `bad_events_formula` must be provided.
        good_events_formula:
          $ref: '#/components/schemas/SLOFormula'
        queries:
          example:
          - data_source: metrics
            name: query1
            query: sum:trace.servlet.request.hits{!http.status_code:500} by {env}.as_count()
          - data_source: metrics
            name: query2
            query: sum:trace.servlet.request.hits{http.status_code:500} by {env}.as_count()
          items:
            $ref: '#/components/schemas/SLODataSourceQueryDefinition'
          minItems: 1
          type: array
      required:
      - good_events_formula
      - bad_events_formula
      - queries
      type: object
    Creator:
      description: Object describing the creator of the shared element.
      properties:
        email:
          description: Email of the creator.
          type: string
        handle:
          description: Handle of the creator.
          type: string
        name:
          description: Name of the creator.
          nullable: true
          type: string
      readOnly: true
      type: object
    SLOListResponse:
      description: A response with one or more service level objective.
      properties:
        data:
          description: An array of service level objective objects.
          items:
            $ref: '#/components/schemas/ServiceLevelObjective'
          type: array
        errors:
          description: 'An array of error messages. Each endpoint documents how/whether this field is

            used.'
          items:
            description: The error message.
            type: string
          type: array
        metadata:
          $ref: '#/components/schemas/SLOListResponseMetadata'
      type: object
    SLOCorrectionUpdateRequest:
      description: An object that defines a correction to be applied to an SLO.
      properties:
        data:
          $ref: '#/components/schemas/SLOCorrectionUpdateData'
      type: object
    SLOHistoryResponseData:
      description: An array of service level objective objects.
      properties:
        from_ts:
          description: The `from` timestamp in epoch seconds.
          example: 1615323990
          format: int64
          type: integer
        group_by:
          description: 'For `metric` based SLOs where the query includes a group-by clause, this represents
            the list of grouping parameters.


            This is not included in responses for `monitor` based SLOs.'
          items:
            description: A grouping parameter.
            type: string
          type: array
        groups:
          description: 'For grouped SLOs, this represents SLI data for specific groups.


            This is not included in the responses for `metric` based SLOs.'
          items:
            $ref: '#/components/schemas/SLOHistoryMonitor'
          type: array
        monitors:
          description: 'For multi-monitor SLOs, this represents SLI data for specific monitors.


            This is not included in the responses for `metric` based SLOs.'
          items:
            $ref: '#/components/schemas/SLOHistoryMonitor'
          type: array
        overall:
          $ref: '#/components/schemas/SLOHistorySLIData'
        series:
          $ref: '#/components/schemas/SLOHistoryMetrics'
        thresholds:
          additionalProperties:
            $ref: '#/components/schemas/SLOThreshold'
          description: mapping of string timeframe to the SLO threshold.
          example:
            my_service:
              target: 95
              timeframe: 7d
          type: object
        to_ts:
          description: The `to` timestamp in epoch seconds.
          example: 1615928790
          format: int64
          type: integer
        type:
          $ref: '#/components/schemas/SLOType'
        type_id:
          $ref: '#/components/schemas/SLOTypeNumeric'
      type: object
    SLOCountDefinitionWithTotalEventsFormula:
      additionalProperties: false
      description: SLO count definition using a total events formula alongside a good events formula.
      properties:
        good_events_formula:
          $ref: '#/components/schemas/SLOFormula'
        queries:
          example:
          - data_source: metrics
            name: query1
            query: sum:trace.servlet.request.hits{!http.status_code:500} by {env}.as_count()
          - data_source: metrics
            name: query2
            query: sum:trace.servlet.request.hits{http.status_code:500} by {env}.as_count()
          items:
            $ref: '#/components/schemas/SLODataSourceQueryDefinition'
