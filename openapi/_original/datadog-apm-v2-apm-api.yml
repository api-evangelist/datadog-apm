  /api/v2/spans/analytics/aggregate:
    post:
      description: 'The API endpoint to aggregate spans into buckets and compute metrics and timeseries.

        This endpoint is rate limited to `300` requests per hour.'
      operationId: AggregateSpans
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      compute:
                      - aggregation: pc90
                        interval: 5m
                        metric: '@duration'
                        type: timeseries
                      filter:
                        from: now-15m
                        query: service:web* AND @http.status_code:[200 TO 299]
                        to: now
                      group_by:
                      - facet: host
                        histogram:
                          interval: 10
                          max: 100
                          min: 50
                        sort:
                          aggregation: count
                          order: asc
                      options:
                        timezone: GMT
                    type: aggregate_request
            schema:
              $ref: '#/components/schemas/SpansAggregateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                    - attributes:
                        by:
                          host: my-hostname
                        computes:
                          c0: 19
                      id: abc-123
                      type: bucket
                    meta:
                      elapsed: 132
