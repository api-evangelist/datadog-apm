        '200':
          description: OK
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Delete a retention filter
      tags:
      - APM Retention Filters
      x-permission:
        operator: OR
        permissions:
        - apm_retention_filter_write
    get:
      description: Get an APM retention filter.
      operationId: GetApmRetentionFilter
      parameters:
      - $ref: '#/components/parameters/RetentionFilterIdParam'
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        enabled: true
                        filter:
                          query: '@http.status_code:200 service:my-service'
                        filter_type: spans-sampling-processor
                        name: my retention filter
                        rate: 1.0
                      id: abc-123
                      type: apm_retention_filter
              schema:
                $ref: '#/components/schemas/RetentionFilterResponse'
          description: OK
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Get a given APM retention filter
      tags:
      - APM Retention Filters
      x-permission:
        operator: OR
        permissions:
        - apm_retention_filter_read
    put:
      description: 'Update a retention filter from your organization.


        Default filters (filters with types spans-errors-sampling-processor and spans-appsec-sampling-processor)
        cannot be renamed or removed.'
      operationId: UpdateApmRetentionFilter
      parameters:
      - $ref: '#/components/parameters/RetentionFilterIdParam'
      requestBody:
        content:
          application/json:
            examples:
              default:
                value:
                  data:
                    attributes:
                      enabled: true
                      filter:
                        query: '@http.status_code:200 service:my-service'
                      filter_type: spans-sampling-processor
                      name: my retention filter
                      rate: 1.0
                      trace_rate: 1.0
                    id: retention-filter-id
                    type: apm_retention_filter
            schema:
              $ref: '#/components/schemas/RetentionFilterUpdateRequest'
        description: The updated definition of the retention filter.
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        enabled: true
                        filter:
                          query: '@http.status_code:200 service:my-service'
                        filter_type: spans-sampling-processor
                        name: my retention filter
                        rate: 1.0
                      id: abc-123
                      type: apm_retention_filter
              schema:
                $ref: '#/components/schemas/RetentionFilterResponse'
          description: OK
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '403':
          $ref: '#/components/responses/NotAuthorizedResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Update a retention filter
      tags:
      - APM Retention Filters
      x-codegen-request-body-name: body
      x-permission:
        operator: OR
        permissions:
        - apm_retention_filter_write
  /api/v2/apm/services:
    get:
      operationId: GetServiceList
      parameters:
      - description: Filter services by environment. Can be set to `*` to return all services across all
          environments.
        in: query
        name: filter[env]
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        metadata:
                        - isTraced: true
                          isUsm: false
                        services:
                        - test-service
                      id: abc-123
                      type: services_list
              schema:
                $ref: '#/components/schemas/ServiceList'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - apm_read
      summary: Get service list
      tags:
      - APM
  /api/v2/services/definitions:
