    site:
      default: datadoghq.com
      description: The regional site for Datadog customers.
      enum:
      - datadoghq.com
      - us3.datadoghq.com
      - us5.datadoghq.com
      - ap1.datadoghq.com
      - ap2.datadoghq.com
      - uk1.datadoghq.com
      - datadoghq.eu
      - ddog-gov.com
      - us2.ddog-gov.com
      - uk1.datadoghq.com
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
- url: '{protocol}://{name}'
  variables:
    name:
      default: api.datadoghq.com
      description: Full site DNS name.
    protocol:
      default: https
      description: The protocol for accessing the API.
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: Any Datadog deployment.
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
security:
- apiKeyAuth: []
  appKeyAuth: []
tags:
- description: Observe, troubleshoot, and improve cloud-scale applications with all telemetry in context
  name: APM
paths:
  /api/v2/apm/services:
    get:
      operationId: GetServiceList
      parameters:
      - description: Filter services by environment. Can be set to `*` to return all services across all
          environments.
        in: query
        name: filter[env]
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                default:
                  value:
                    data:
                      attributes:
                        metadata:
                        - isTraced: true
                          isUsm: false
                        services:
                        - test-service
                      id: abc-123
                      type: services_list
              schema:
                $ref: '#/components/schemas/ServiceList'
          description: OK
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      security:
      - apiKeyAuth: []
        appKeyAuth: []
      - AuthZ:
        - apm_read
      summary: Get service list
      tags:
      - APM
components:
  schemas:
    ServiceList:
      description: The response body for the service list endpoint.
      properties:
        data:
          $ref: '#/components/schemas/ServiceListData'
      type: object
    ServiceListData:
      description: A single data item in the service list response.
      properties:
        attributes:
          $ref: '#/components/schemas/ServiceListDataAttributes'
        id:
          description: The unique identifier of the service.
          type: string
        type:
          $ref: '#/components/schemas/ServiceListDataType'
      required:
      - type
      type: object
    ServiceListDataAttributes:
      description: Attributes of a service list entry, containing metadata and a list of service names.
      properties:
        metadata:
          description: A list of metadata items associated with the service.
          items:
            $ref: '#/components/schemas/ServiceListDataAttributesMetadataItems'
          type: array
        services:
          description: A list of service names.
          items:
            description: A single service name.
            type: string
          type: array
      type: object
    ServiceListDataType:
      default: services_list
      description: Services list resource type.
      enum:
      - services_list
      example: services_list
      type: string
      x-enum-varnames:
      - SERVICES_LIST
    APIErrorResponse:
      description: API error response.
      properties:
        errors:
          description: A list of errors.
          example:
          - Bad Request
          items:
            description: A list of items.
            example: Bad Request
            type: string
          type: array
      required:
      - errors
      type: object
    ServiceListDataAttributesMetadataItems:
      description: An object containing metadata flags for a service, indicating whether it is traced
        by APM or monitored through Universal Service Monitoring.
      properties:
        isTraced:
          description: Indicates whether the service is traced by APM.
          type: boolean
        isUsm:
          description: Indicates whether the service uses Universal Service Monitoring.
          type: boolean
      type: object
  responses:
    TooManyRequestsResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIErrorResponse'
      description: Too many requests
  securitySchemes:
    AuthZ:
      description: This API uses OAuth 2 with the implicit grant flow.
