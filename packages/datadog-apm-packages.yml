provider: Datadog APM
providerId: datadog-apm
note: >-
  Datadog ships two distinct first-party library families and both are relevant to APM. The
  datadog-api-client-* generated clients wrap the REST API captured in openapi/ (SLOs, spans, span
  metrics, retention filters, service definitions); the dd-trace / ddtrace tracer libraries are the
  in-process instrumentation that produces the spans in the first place. Versions and dates were read
  from each registry's own metadata endpoint on 2026-09-05.
