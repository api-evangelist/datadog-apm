specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Datadog APM
providerId: datadog-apm
generated: '2026-09-05'
method: searched
source: https://www.datadoghq.com/pricing/?product=apm--distributed-tracing
created: '2026-05-04'
modified: '2026-09-05'
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented free/professional/enterprise tiers with fabricated
  1,000 / 100,000 request quotas. Datadog does not price this API by request at all; every value below
  is read from Datadog's own pricing page.
tags:
- APM
- Distributed Tracing
- Observability
- Pricing
description: >-
  Datadog APM is priced per monitored HOST (or per application instance for serverless), not per API
  call. The REST API in openapi/ is included with the product — there is no separate API plan, no API
  key charge, and no per-request price. What is metered is telemetry volume: ingested and indexed
  spans. An agent's cost exposure from calling this API is therefore indirect: writes that change
  retention filters or span metrics change the bill.
billing_unit: host per month (APM), active application instance per month (serverless)
currency: USD
plan_count: 3
plans:
- id: apm
  name: APM
  price: '31.00'
  price_on_demand: '48.00'
  currency: USD
  period: month
  unit: per host
  billing: $31/host/month billed annually, or $48 on-demand, with Infrastructure Monitoring attached.
  included:
  - Automatic service discovery and dependency mapping (Universal Service Monitoring)
  - 15-minute live trace search and analytics
  - 15-day historical search and analytics
  - RED metrics based on 100% of traffic with 15-month retention
  - Correlation of traces with metrics, logs, processes and network data
  - 'Span retention: 1 million Indexed Spans per APM host per month (or 1,370 per host per hour, averaged across hosts)'
  - 150GB per APM host of Ingested Spans, summed across all APM hosts
- id: apm-pro
  name: APM Pro
  price: '35.00'
  price_on_demand: '54.00'
  currency: USD
  period: month
  unit: per host
  billing: $35/host/month billed annually, or $54 on-demand, with Infrastructure Monitoring attached.
  included:
  - Everything in APM
  - 'Data Streams Monitoring: automatic dependency mapping of queues, consumers and producers'
  - End-to-end streaming pipeline performance
  - Faulty queue detection
- id: apm-enterprise
  name: APM Enterprise
  price: '40.00'
  price_on_demand: '60.00'
  currency: USD
  period: month
  unit: per host
  billing: $40/host/month billed annually, or $60 on-demand, with Infrastructure Monitoring attached.
  included:
  - Everything in APM Pro
  - 'Continuous Profiler: code-level tracing including wall, lock, CPU and I/O time'
  - CPU and memory code profiling in production
related_plans:
- id: serverless-application-apm
  name: Serverless Application APM
  price: '6.00'
  price_on_demand: '4.32'
  unit: per actively traced application instance per month
  note: >-
    AWS Fargate, Azure App Service / Container Apps / Functions, Google Cloud Run, GKE Autopilot. The
    listed on-demand figure ($4.32) attaches to the adjacent Serverless Application Monitoring row on
    the page; recorded as published rather than reconciled.
- id: serverless-functions-apm
  name: Serverless Functions APM
  price: '10.00'
  unit: per million traced invocations per month (or per million state transitions for workflows)
overages:
- item: Ingested Spans beyond the included 150GB per APM host
  price: '0.10'
  unit: per GB
  note: For 15-minute live trace search and analytics.
- item: Custom events beyond the account allotment
  price: '2.00'
  price_on_demand: '3.00'
  unit: per 100,000 custom events
free_tier:
  exists: false
  note: >-
    There is no free APM tier. Datadog offers a 14-day free trial (Start Free Trial / Get Started
    Free), and the free tier that does exist on the pricing page belongs to Infrastructure Monitoring
    (up to 5 hosts, 1-day metric retention), not APM.
trial: https://www.datadoghq.com/free-datadog-trial/
api_pricing:
  metered_by_request: false
  note: >-
    No plan prices API requests. Rate limits, not price, are the constraint on API usage — see
    rate-limits/datadog-apm-rate-limits.yml.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
